# Shared Vimba X camera parameters, loaded by both
#   camera_bringup/launch/sealbot_camera.launch.xml      (standalone node)
#   apriltag_bringup/launch/cam_isaac_tag.launch.xml     (composable node)
# File paths (settings_file, camera_info_url) stay in the launch files because
# they need $(find-pkg-share ...).
/**:
  ros__parameters:
    camera_id: DEV_1AB22C0B5BB3
    camera_frame_id: camera_optical_frame
    # Stamp images with the camera's own capture time converted to ROS time
    # (needs the Sealbot patch to vimbax_camera; see sealbot_camera_time_sync.patch).
    # use_ros_time is the fallback (arrival time) until the clocks are synced.
    sync_camera_time: true
    use_ros_time: true
